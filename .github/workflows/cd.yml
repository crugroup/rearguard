name: CD

# Every push to main whose CI run succeeds is tagged and released, as the commit CI tested.
# The version is the patch bump of the latest X.Y.Z tag (0.1.0 if there is none).
# For a minor or major bump, run this workflow by hand on main and give the version; it runs
# the tests first. Tags and versions have no `v` prefix.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y.Z (empty: bump the patch of the latest release)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release from main only, not from $GITHUB_REF"
            exit 1
          fi

  tests:
    needs: guard
    uses: ./.github/workflows/ci.yml

  release:
    needs: [tests]
    # A manual run needs its own tests to pass. An automatic run needs the CI run that
    # triggered it to have passed on a push, not on a pull request.
    if: >-
      ${{ !cancelled() && (
        needs.tests.result == 'success' ||
        (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # CI runs finish out of order. Release only the tip of main, so that a newer
          # commit never gets an older version.
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$TESTED_SHA" ]; then
            echo "::notice::$TESTED_SHA is no longer the tip of main; the newer commit releases itself."
            exit 0
          fi
          latest=$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sed -n 1p || true)
          if [ -n "$INPUT_VERSION" ]; then
            next="$INPUT_VERSION"
            if ! printf '%s' "$next" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Version must be X.Y.Z, without a v prefix, got '$INPUT_VERSION'"
              exit 1
            fi
          elif [ -z "$latest" ]; then
            next="0.1.0"
          else
            IFS=. read -r major minor patch <<< "$latest"
            next="$major.$minor.$((patch + 1))"
          fi
          if git rev-parse -q --verify "refs/tags/$next" > /dev/null; then
            echo "::error::$next already exists"
            exit 1
          fi
          if [ -n "$latest" ]; then
            highest=$(printf '%s\n%s\n' "$latest" "$next" | sort -V | sed -n '$p')
            if [ "$highest" != "$next" ]; then
              echo "::error::$next is older than the latest release $latest"
              exit 1
            fi
          fi
          echo "Releasing $next (latest was ${latest:-none}) from $TESTED_SHA"
          gh release create "$next" --target "$TESTED_SHA" --title "$next" --generate-notes
