name: tests

on:
  workflow_call: # reused by release.yml
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }}, ${{ matrix.python }} Python
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # default: the Python the runner image ships, used as it comes.
        # latest: the newest stable release, installed by setup-python.
        python: [default, latest]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.python == 'latest'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Show the interpreter
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} --version
      - name: Run the tests
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} -m unittest discover -s tests -v
